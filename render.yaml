services:
  - type: web
    name: civicchain-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/utils/seed.js && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BLOCKCHAIN_MODE
        value: mock
      - key: FRONTEND_URL
        value: "*"
